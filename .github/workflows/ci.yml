name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, Android debug APK, desktop app
        run: ./gradlew :shared:jvmTest :androidApp:assembleDebug :desktopApp:assemble --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ktransfer-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
